<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pub Wheel">
<meta name="theme-color" content="#120a2a">
<title>Pub Wheel</title>
<style>
  :root { --gold: #ffd54a; --gold-dark: #b8860b; --text: #fff8e7; --muted: #cfc3ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #3a1d7a 0%, #120a2a 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
    user-select: none; -webkit-user-select: none;
  }
  h1 {
    margin: 4px 0 2px; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
    color: var(--gold); text-transform: uppercase;
    text-shadow: 0 3px 0 var(--gold-dark), 0 0 18px rgba(255,213,74,.6);
  }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: .95rem; }

  .stage { position: relative; width: min(88vw, 370px); aspect-ratio: 1; }
  .rim {
    position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(145deg, #ffe680, #b8860b 45%, #ffe680 70%, #8a6508);
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .bulb {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: #fff6c9; box-shadow: 0 0 8px 3px #ffd54a;
    transform: translate(-50%, -50%); animation: blink 1s infinite;
  }
  .bulb.alt { animation-delay: .5s; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: .25; } }
  .spinning .bulb { animation-duration: .25s; }

  canvas {
    position: absolute; inset: 7%; width: 86%; height: 86%; border-radius: 50%;
    box-shadow: inset 0 0 0 4px #00000044;
  }
  .flapper {
    position: absolute; top: 2%; left: 50%; z-index: 3;
    width: 0; height: 0; transform-origin: 50% 0;
    border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-top: 34px solid #e8e8e8;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.6));
    translate: -50% 0;
  }
  .flapper.tick { animation: flap .09s ease-out; }
  @keyframes flap { 0% { rotate: 0deg; } 40% { rotate: -22deg; } 100% { rotate: 0deg; } }

  .spin {
    margin-top: 24px; width: min(88vw, 370px);
    background: linear-gradient(#ff4d6d, #c9184a); color: #fff; border: 3px solid var(--gold);
    font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; padding: 16px; border-radius: 40px;
    box-shadow: 0 6px 0 #7a0e2c, 0 0 20px rgba(255,77,109,.5);
  }
  .spin:active { transform: translateY(3px); box-shadow: 0 3px 0 #7a0e2c; }
  .spin:disabled { opacity: .6; }

  .result {
    margin-top: 18px; width: min(88vw, 370px); text-align: center; padding: 16px;
    background: #ffffff12; border: 2px solid var(--gold); border-radius: 18px;
    opacity: 0; transform: scale(.8); transition: all .35s cubic-bezier(.3,1.6,.5,1);
  }
  .result.show { opacity: 1; transform: none; }
  .result small { color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .result h2 { margin: 6px 0; font-size: 1.6rem; color: var(--gold); }
  .result p { margin: 0; color: var(--muted); }

  footer { margin-top: auto; padding-top: 18px; color: var(--muted); font-size: .78rem; text-align: center; }
</style>
</head>
<body>
  <h1>Pub Wheel</h1>
  <p class="sub">Spin to see what you're drinking tonight!</p>

  <div class="stage" id="stage">
    <div class="rim"></div>
    <canvas id="wheel" width="720" height="720"></canvas>
    <div class="flapper" id="flapper"></div>
  </div>

  <button class="spin" id="spinBtn">SPIN!</button>

  <div class="result" id="result">
    <small>Tonight you're drinking</small>
    <h2 id="rName"></h2>
    <p id="rDesc"></p>
  </div>

  <footer>Over 18s only · Please drink responsibly · drinkaware.co.uk</footer>

<script>
// The wheel ALWAYS lands on this one
const WINNER = { name: "JD & Coke", full: "Jack Daniel's & Coke", desc: "Tennessee whiskey, cola, plenty of ice. The wheel has spoken! 🥃" };

const PUB_DRINKS = [
  "Pint of Lager", "Guinness", "Pint of Bitter", "Cider", "Shandy", "Snakebite",
  "Gin & Tonic", "Rum & Coke", "Vodka & Lemonade", "House Red", "House White",
  "Prosecco", "Pimm's", "Single Malt", "Baileys"
];

const COLORS = ["#e63946", "#f4a261", "#ffd60a", "#2a9d8f", "#4361ee", "#9d4edd", "#ff70a6", "#06d6a0"];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const flapper = document.getElementById("flapper");
const spinBtn = document.getElementById("spinBtn");
const resultEl = document.getElementById("result");

let slices = [];
let rotation = 0;     // degrees
let spinning = false;
let audio = null;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 15 pub drinks + the winner = 16 slices, winner in a random spot so it's not obvious
// Every slice gets a random colour (no two neighbours the same), so the winner's colour keeps changing too
let colours = [];
function randomColours(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    let c;
    do {
      c = COLORS[Math.floor(Math.random() * COLORS.length)];
    } while (c === out[i - 1] || (i === n - 1 && c === out[0]));
    out.push(c);
  }
  return out;
}

function buildSlices(draw = true) {
  slices = shuffle([...PUB_DRINKS, WINNER.name]);
  colours = randomColours(slices.length);
  if (draw) drawWheel();
}

function drawWheel() {
  const size = canvas.width, r = size / 2, n = slices.length, seg = Math.PI * 2 / n;
  ctx.clearRect(0, 0, size, size);
  for (let i = 0; i < n; i++) {
    const start = -Math.PI / 2 + i * seg;
    ctx.beginPath();
    ctx.moveTo(r, r);
    ctx.arc(r, r, r, start, start + seg);
    ctx.closePath();
    ctx.fillStyle = colours[i];
    ctx.fill();
    ctx.strokeStyle = "#fff8e7";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.translate(r, r);
    ctx.rotate(start + seg / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.font = "800 26px -apple-system, sans-serif";
    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(0,0,0,.45)";
    ctx.strokeText(slices[i], r - 30, 0);
    ctx.fillStyle = "#fff";
    ctx.fillText(slices[i], r - 30, 0);
    ctx.restore();

    // peg at each slice edge
    const px = r + Math.cos(start) * (r - 10), py = r + Math.sin(start) * (r - 10);
    ctx.beginPath();
    ctx.arc(px, py, 8, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd54a";
    ctx.fill();
  }
  // hub
  const g = ctx.createRadialGradient(r - 15, r - 15, 5, r, r, 70);
  g.addColorStop(0, "#fff6c9"); g.addColorStop(1, "#b8860b");
  ctx.beginPath();
  ctx.arc(r, r, 64, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.font = "56px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🍺", r, r + 4);
}

function addBulbs() {
  const count = 24;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const b = document.createElement("div");
    b.className = "bulb" + (i % 2 ? " alt" : "");
    b.style.left = 50 + Math.cos(a) * 46.5 + "%";
    b.style.top = 50 + Math.sin(a) * 46.5 + "%";
    stage.appendChild(b);
  }
}

function tick() {
  flapper.classList.remove("tick");
  void flapper.offsetWidth;
  flapper.classList.add("tick");
  if (!audio) return;
  const o = audio.createOscillator(), gain = audio.createGain();
  o.type = "square";
  o.frequency.value = 1400;
  gain.gain.setValueAtTime(0.08, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.04);
  o.connect(gain).connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + 0.05);
}

function fanfare() {
  if (!audio) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = audio.createOscillator(), gain = audio.createGain();
    const t = audio.currentTime + i * 0.12;
    o.type = "triangle";
    o.frequency.value = f;
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(gain).connect(audio.destination);
    o.start(t);
    o.stop(t + 0.4);
  });
}

function spin() {
  if (spinning) return;
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === "suspended") audio.resume();

  spinning = true;
  spinBtn.disabled = true;
  stage.classList.add("spinning");
  resultEl.classList.remove("show");

  // New positions and colours for this spin, drawn once the wheel is a blur
  buildSlices(false);
  let redrawn = false;

  const n = slices.length, segDeg = 360 / n;
  const pick = slices.indexOf(WINNER.name);                       // rigged!
  const jitter = (Math.random() - 0.5) * segDeg * 0.6;            // land at a random spot inside the slice
  const centreDeg = (pick + 0.5) * segDeg + jitter;
  const start = rotation;
  const needed = (360 - centreDeg - (start % 360) + 720) % 360;
  const end = start + 360 * (5 + Math.floor(Math.random() * 3)) + needed;
  const duration = 5500 + Math.random() * 1000;
  const t0 = performance.now();
  let lastPeg = Math.floor(start / segDeg);

  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - t, 4);
    rotation = start + (end - start) * eased;
    canvas.style.transform = `rotate(${rotation}deg)`;
    if (!redrawn && t > 0.12) { redrawn = true; drawWheel(); }
    const peg = Math.floor(rotation / segDeg);
    if (peg !== lastPeg) { lastPeg = peg; tick(); }
    if (t < 1) return requestAnimationFrame(frame);

    document.getElementById("rName").textContent = WINNER.full;
    document.getElementById("rDesc").textContent = WINNER.desc;
    resultEl.classList.add("show");
    stage.classList.remove("spinning");
    fanfare();
    spinning = false;
    spinBtn.disabled = false;
    spinBtn.textContent = "SPIN AGAIN!";
  }
  requestAnimationFrame(frame);
}

spinBtn.addEventListener("click", spin);
addBulbs();
buildSlices();
</script>
</body>
</html>
